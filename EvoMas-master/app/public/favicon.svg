<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0d1117"/>
  <!-- edges -->
  <line x1="32" y1="10" x2="50" y2="28" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="32" y1="10" x2="14" y2="28" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="50" y1="28" x2="32" y2="46" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="14" y1="28" x2="32" y2="46" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="50" y1="28" x2="14" y2="28" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="32" y1="46" x2="32" y2="57" stroke="#56d364" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- top node (orchestrator) -->
  <circle cx="32" cy="10" r="5.5" fill="#58a6ff"/>
  <!-- mid-left node -->
  <circle cx="14" cy="28" r="4.5" fill="#a371f7"/>
  <!-- mid-right node -->
