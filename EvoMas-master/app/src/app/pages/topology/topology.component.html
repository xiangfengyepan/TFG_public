<div class="topo-layout">

  <app-topo-left-palette
      [predefinedList]="predefinedList"
      [loadedList]="loadedList"
      [currentConfigName]="currentConfigName"
      (loadConfig)="loadPredefined($event)"
      (renameLoaded)="renameLoaded($event)"
      (deleteLoaded)="deleteLoaded($event)" />

  <div class="center-col">
    <app-graph-toolbar
        [currentConfigName]="currentConfigName"
        [hasConfig]="!!currentConfig"
        [isLoadedConfig]="isLoadedConfig"
        [dirty]="dirty"
        [validated]="validated"
        [addEdgeMode]="addEdgeMode"
        [selectedAgent]="selectedAgent"
        [selectedEdgeId]="selectedEdgeId"
        [saveFlash]="saveFlash"
        [validateFlash]="validateFlash"
        [saveError]="saveError"
        [outline]="superStepOutline()"
        (toggleAddEdge)="toggleAddEdgeMode()"
        (delete)="deleteSelected()"
        (rename)="renameSelected()"
        (validate)="validate()"
        (save)="saveToDisk()"
        (fit)="fitGraph()"
        (relayout)="relayout()"
        (reload)="reloadGraph()" />

    <app-validation-panels
        [errors]="validationErrors"
        [warnings]="validationWarnings"
        (dismissErrors)="dismissValidationErrors()"
        (dismissWarnings)="dismissValidationWarnings()" />

    <app-graph-canvas
        [currentConfig]="currentConfig"
        [currentConfigName]="currentConfigName"
        [isLoadedConfig]="isLoadedConfig"
        [addEdgeMode]="addEdgeMode"
        [savedPositions]="savedPositionsForCurrent"
        [typeColor]="typeColor"
        [classToType]="classToType"
        [loadError]="loadError"
        [renderSeq]="renderSeq"
        (nodeSelected)="onNodeSelected($event)"
        (edgeSelected)="onEdgeSelected($event)"
        (selectionCleared)="onSelectionCleared()"
        (edgeAdded)="onEdgeAdded($event)"
        (nodeDropped)="onNodeDropped($event)"
        (positionsChanged)="onPositionsChanged($event)"
        (requestDelete)="onRequestDelete()"
        (addEdgeModeChange)="onAddEdgeModeChange($event)" />

    <div class="agent-palette">
      <span class="palette-label">Drag a type →</span>
      @for (t of agentTypes; track t.type) {
        <evo-agent-type-picker
          [agentType]="t.type"
          [color]="t.color"
          [variants]="variantsFor(t.type)"
          [selectedVariantKey]="selectedVariantKey(t.type)"
          [draggable]="isLoadedConfig"
          (variantChange)="onVariantChange(t.type, $event)" />
      }
      @if (agentTypes.length === 0) {
        <span class="palette-label" style="opacity:.6">Loading types…</span>
      }
    </div>
  </div>

  <app-agent-inspector
      [selectedAgent]="selectedAgent"
      [agentBlock]="agentBlock"
      [agentBadgeColor]="agentBadgeColor(selectedAgent)"
      [agentLabel]="selectedAgent ? labelOrId(selectedAgent) : ''"
      [isLoadedConfig]="isLoadedConfig"
      [modelSelectOptions]="modelSelectOptions"
      [availableTools]="availableTools"
      [currentTools]="currentTools"
      [unusedToolNames]="unusedToolNames"
      [currentAgentType]="currentAgentType"
      [promptTab]="promptTab"
      [toolParamsError]="toolParamsError"
      [supportsKnob]="supportsKnob"
      [paramsJson]="paramsJson"
      [getPrompt]="getPrompt"
      [toolDescription]="toolDescription"
      (field)="onAgentField($event)"
      (addTool)="addTool($event)"
      (removeTool)="removeTool($event)"
      (paramsInput)="onParamsInput($event)"
      (togglePromptTab)="togglePromptTab($event)"
      (promptChange)="onPromptChange($event)" />

</div>
