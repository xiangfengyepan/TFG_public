<div class="infer-layout">
  <app-instance-picker-tree
      [instances]="instances"
      [instancesTotal]="instancesTotal"
      [loadingInstances]="loadingInstances"
      [refreshing]="refreshing"
      [refreshError]="refreshError"
      [selectedIds]="state.selectedInstanceIds"
      [selectionCount]="selectionCount"
      [openSubsets]="state.openSubsets"
      [openSplits]="state.openSplits"
      [search]="instanceSearch"
      [customFormOpen]="customFormOpen"
      (searchChange)="instanceSearch = $event"
      (toggleSubset)="state.toggleSubset($event)"
      (toggleSplit)="state.toggleSplit($event.subset, $event.split)"
      (toggleInstance)="state.toggleInstance($event)"
      (toggleSubsetSelect)="toggleSubsetSelection($event)"
      (toggleSplitSelect)="toggleSplitSelection($event)"
      (refreshLeaf)="refreshLeaf($event)"
      (refreshSubset)="refreshSubset($event)"
      (refreshAll)="refreshAll()"
      (selectAllVisible)="selectAllVisible()"
      (clearSelection)="state.clearSelection()"
      (toggleCustomForm)="toggleCustomForm()" />

  <div class="main-col">
    <app-run-controls-bar
        [config]="config"
        [configs]="configs"
        [running]="running"
        [runInstancesCount]="runInstances.length"
        [selectionCount]="selectionCount"
        [firstSelected]="firstSelected"
        [showThinking]="showThinking"
        (configChange)="setConfig($event)"
        (showThinkingChange)="showThinking = $event"
        (run)="run()"
        (cancel)="cancel()"
        (clearRun)="clearRun()" />

    <app-batch-progress-strip
        [runInstances]="runInstances"
        [currentInstance]="currentInstance"
        (selectInstance)="selectInstanceInRun($event)" />

    <div class="stream-area" #scrollEl (scroll)="onLogScroll()">
      <app-inference-instance-view
          [instance]="currentInstance"
          [statusMsg]="statusMsg"
          [running]="currentInstance?.status === 'running'"
          [cancelled]="cancelled"
          [showThinking]="showThinking" />
    </div>
  </div>
</div>

<app-custom-repo-modal
    [open]="customFormOpen"
    [submitting]="customSubmitting"
    [repo]="customRepo"
    [problem]="customProblem"
    [baseCommit]="customBaseCommit"
    [error]="customError"
    (repoChange)="customRepo = $event"
    (problemChange)="customProblem = $event"
    (baseCommitChange)="customBaseCommit = $event"
    (submit)="submitCustomInstance()"
    (close)="toggleCustomForm()" />
