# Copy this file to:  TFG_public/.github/workflows/deploy-repo-graph.yml
#
# It builds the SWE-bench graph visualizer and publishes it to the
# `repo-graph/` subfolder of the gh-pages branch, so the final URL is:
#   https://xiangfengyepan.github.io/TFG_public/repo-graph/
#
# `keep_files: true` + `destination_dir: repo-graph` means this deploy only
# touches its own subfolder — other deploys on gh-pages are left alone.

name: Deploy repo-graph

on:
  push:
    branches: [main]
    paths:
      - 'First_Part_Analysis/repo_graph-master/**'
      - '.github/workflows/deploy-repo-graph.yml'
  workflow_dispatch:

permissions:
  contents: write   # required to push to gh-pages

concurrency:
  group: deploy-repo-graph
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: First_Part_Analysis/repo_graph-master

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build static site
        run: ./deploy/build.ps1 -BasePath "/TFG_public/repo-graph/"

      - name: Publish to gh-pages/repo-graph
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./First_Part_Analysis/repo_graph-master/deploy/dist
          destination_dir: repo-graph
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: repo-graph @ ${{ github.sha }}'
